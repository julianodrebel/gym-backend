# ========================================================================
# Configuração da Aplicação - Gym Backend
# Arquitetura Hexagonal | Java | Quarkus | PostgreSQL
# ========================================================================

# === Banco de Dados (Perfil Dev - PostgreSQL local) ===
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=gymuser
%dev.quarkus.datasource.password=gympass
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/gym_backend

# === Hibernate ORM (Dev) ===
%dev.quarkus.hibernate-orm.database.generation=none
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true

# === Banco de Dados (Perfil Test - H2 in-memory) ===
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:gym_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL

# === Hibernate ORM (Test) ===
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.hibernate-orm.log.sql=false

# === Flyway Migrations ===
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=true

%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.locations=db/migration

# === Banco de Dados (Perfil Prod) ===
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME:gymuser}
%prod.quarkus.datasource.password=${DB_PASSWORD:gympass}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/gym_backend}
%prod.quarkus.hibernate-orm.database.generation=none

# === Segurança JWT ===
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=gym-backend
quarkus.smallrye-jwt.enabled=true

# Configuração de geração de token
jwt.duration.access-token=900
jwt.duration.refresh-token=604800
jwt.issuer=gym-backend

# === CORS Seguro (OWASP) ===
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8081}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Requested-With
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# === Logging Estruturado (OWASP A09) ===
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.gymbackend".level=DEBUG

%prod.quarkus.log.console.json=true
%prod.quarkus.log.level=WARN
%prod.quarkus.log.category."com.gymbackend".level=INFO

# === HTTP Server ===
quarkus.http.port=8080
%test.quarkus.http.test-port=0

# === Health Check ===
quarkus.smallrye-health.ui.enable=true

# === Jackson - Datas no formato ISO ===
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.write-dates-as-timestamps=false
